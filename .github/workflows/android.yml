name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble APKs
        run: gradle :app:assembleDebug :app:assembleBeta --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zhypix-fresh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: zhypix-fresh-beta-apk
          path: app/build/outputs/apk/beta/*.apk
          retention-days: 14
