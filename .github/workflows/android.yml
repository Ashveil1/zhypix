name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'ndk;28.2.13676358' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Create debug keystore and env
        run: |
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"
          printf 'GEMINI_API_KEY=placeholder\n' > .env

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
