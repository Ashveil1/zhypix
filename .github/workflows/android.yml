name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'ndk;28.2.13676358' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Create debug keystore and env
        run: |
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"
          printf 'GEMINI_API_KEY=placeholder\n' > .env

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Record UI screenshots
        run: gradle :app:recordRoborazziDebug --no-daemon || true

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/src/test/screenshots/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zhypix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'ndk;28.2.13676358' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Create debug keystore and env
        run: |
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"
          printf 'GEMINI_API_KEY=placeholder\n' > .env

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Run screen-control e2e tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: true
          disable-animations: true
          script: |
            set -x
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure enabled_accessibility_services com.zhypix.app.jdufyx/com.example.service.ZhypixAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            sleep 5
            adb shell am instrument -w -e class com.example.ScreenControlE2eTest com.zhypix.app.jdufyx.test/androidx.test.runner.AndroidJUnitRunner || TEST_FAILED=1
            adb shell run-as com.zhypix.app.jdufyx cat files/agent_diagnostics.jsonl > agent_diagnostics.jsonl || true
            adb shell screencap -p /sdcard/e2e_final.png || true
            adb pull /sdcard/e2e_final.png e2e_final.png || true
            if [ "$TEST_FAILED" = "1" ]; then exit 1; fi

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            agent_diagnostics.jsonl
            e2e_final.png
          retention-days: 14
          if-no-files-found: ignore
