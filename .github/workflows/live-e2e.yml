name: Live model e2e

on:
  workflow_dispatch:
  push:
    branches: [fresh-app]
    paths:
      - '.github/workflows/live-e2e.yml'
      - 'app/src/androidTest/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build app and test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run live model e2e on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            set -x
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure enabled_accessibility_services com.zhypix.fresh/com.zhypix.fresh.service.AgentAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am instrument -w -e e2eKey "$OPENROUTER_E2E_KEY" -e class com.zhypix.fresh.LiveModelE2eTest com.zhypix.fresh.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt || true
            adb shell am instrument -w -e class com.zhypix.fresh.GestureE2eTest com.zhypix.fresh.test/androidx.test.runner.AndroidJUnitRunner | tee gesture.txt || true
            adb logcat -d -t 2000 > logcat_tail.txt || true
            if grep -q "FAILURES" instrument.txt; then exit 1; fi
            grep -q "OK (1 test)" instrument.txt
            if grep -q "FAILURES" gesture.txt; then exit 1; fi
            grep -q "OK (2 tests)" gesture.txt
        env:
          OPENROUTER_E2E_KEY: ${{ secrets.OPENROUTER_E2E_KEY }}

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-results
          path: |
            instrument.txt
            gesture.txt
            logcat_tail.txt
          if-no-files-found: ignore
          retention-days: 14
